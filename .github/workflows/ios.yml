name: iOS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancela ejecuciones antiguas de la misma rama si se empuja algo nuevo
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar, testear y analizar
    # Los proyectos iOS SOLO compilan en macOS (necesitan Xcode)
    runs-on: macos-latest

    env:
      SCHEME: AhorraGas
      PROJECT: AhorraGas.xcodeproj

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Seleccionar la última versión de Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Análisis estático (SwiftLint, bloqueante)
        run: |
          brew install swiftlint
          swiftlint lint --strict

      # No hardcodeamos el modelo de iPhone: preguntamos al runner qué
      # simuladores tiene y cogemos un iPhone del runtime de iOS MÁS NUEVO.
      # Así el CI no se rompe al cambiar la imagen (iPhone 16 -> 17 -> ...) y
      # el iOS del simulador cumple el deployment target de los targets de test.
      - name: Elegir un simulador de iPhone disponible
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '
            .devices
            | to_entries
            | map(select(.key | test("iOS")))
            | sort_by(.key)
            | last.value
            | map(select(.name | startswith("iPhone")))
            | .[0].udid
          ')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            echo "::error::No hay ningún simulador de iPhone disponible en el runner."
            exit 1
          fi
          echo "Simulador elegido: $UDID"
          echo "SIMULATOR_ID=$UDID" >> "$GITHUB_ENV"

      # Solo tests unitarios (AhorraGasTests): son rápidos (~seg) y prueban la
      # lógica de dominio. Los UITests son lentos (arrancan la app varias veces)
      # y de momento son plantilla; cuando haya UITests reales se correrán en un
      # job aparte o en local, no en cada PR.
      - name: Compilar (build-for-testing)
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "id=$SIMULATOR_ID" \
            -only-testing:AhorraGasTests \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Ejecutar tests (test-without-building)
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "id=$SIMULATOR_ID" \
            -only-testing:AhorraGasTests \
            CODE_SIGNING_ALLOWED=NO
