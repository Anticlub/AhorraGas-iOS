name: iOS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancela ejecuciones antiguas de la misma rama si se empuja algo nuevo
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar, testear y analizar
    # Los proyectos iOS SOLO compilan en macOS (necesitan Xcode)
    runs-on: macos-latest

    env:
      SCHEME: AhorraGas
      PROJECT: AhorraGas.xcodeproj

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Seleccionar la última versión de Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Análisis estático (SwiftLint, bloqueante)
        run: |
          brew install swiftlint
          swiftlint lint --strict

      # No hardcodeamos el modelo de iPhone: preguntamos al runner qué
      # simuladores tiene y cogemos el primer iPhone disponible. Así el CI
      # no se rompe cuando GitHub cambie la imagen (iPhone 16 -> 17 -> ...).
      - name: Elegir un simulador de iPhone disponible
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            echo "::error::No hay ningún simulador de iPhone disponible en el runner."
            exit 1
          fi
          echo "Simulador elegido: $UDID"
          echo "SIMULATOR_ID=$UDID" >> "$GITHUB_ENV"

      - name: Compilar (build-for-testing)
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "id=$SIMULATOR_ID" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Ejecutar tests (test-without-building)
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "id=$SIMULATOR_ID" \
            CODE_SIGNING_ALLOWED=NO
