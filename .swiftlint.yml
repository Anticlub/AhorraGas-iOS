# SwiftLint configuration — AhorraGas iOS

included:
  - AhorraGas

excluded:
  - AhorraGas/Resources
  - DerivedData
  - .build
  - Pods

# Reglas desactivadas
disabled_rules:
  - trailing_whitespace

# Reglas opcionales activadas
opt_in_rules:
  - empty_count
  - force_unwrapping
  - implicitly_unwrapped_optional
  - missing_docs
  - private_outlet
  - sorted_imports

# Límites
line_length:
  warning: 120
  error: 200

file_length:
  warning: 400
  error: 600

function_body_length:
  warning: 40
  error: 60

type_body_length:
  warning: 200
  error: 300

# Nomenclatura
type_name:
  min_length: 3
  max_length: 50

identifier_name:
  min_length: 2
  max_length: 50
  excluded:
    - id
    - x
    - y